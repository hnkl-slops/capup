[package]
name = "capup"
version = "0.1.0"
description = "Records what is behind a translucent window to mp4"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name from clashing with the bin name on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "capup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { version = "0.10", default-features = false, features = ["async", "av", "sc", "dispatch", "macos_13_0"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "2.0.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
