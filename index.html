<!doctype html>
<html lang="en" class="h-full bg-transparent">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>capup</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body class="h-full overflow-hidden bg-transparent font-sans text-[13px] text-white select-none">
    <main
      id="frame"
      data-tauri-drag-region
      class="flex h-full items-end justify-center border-2 border-dashed border-white/80 bg-blue-400/10 data-recording:border-solid data-recording:border-red-500/90 data-recording:bg-transparent"
    >
      <!-- The bar is not a drag region, as it stays clickable while recording and the window must not move then. -->
      <footer
        id="bar"
        class="mb-3 flex max-w-[calc(100%-24px)] items-center gap-2 rounded-lg bg-neutral-900/85 px-2 py-1.5"
      >
        <button id="toggle" type="button" class="shrink-0 rounded-md bg-red-600 px-2.5 py-1 hover:bg-red-500"></button>
        <!-- Errors and saved paths are long, and they must be readable in full. -->
        <button id="status" type="button" class="min-w-0 rounded-md px-2.5 py-1 text-left wrap-anywhere hover:bg-white/20"></button>
        <button
          id="close"
          type="button"
          aria-label="Close"
          class="shrink-0 rounded-md bg-white/10 px-2.5 py-1 hover:bg-white/20"
        >
          ×
        </button>
      </footer>
    </main>
  </body>
</html>
